server.port=8080

# MySQL local
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/salaveiro
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:admin}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logs do filter de requests (vai para o terminal)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# API keys (substitui pelos teus valores)
security.api-key.read=4294
security.api-key.admin=4294
security.admin.username=admin


app.upload-dir=./uploads

# Uploads de imagens
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB